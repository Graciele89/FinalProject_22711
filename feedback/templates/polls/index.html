{% load static %}

<link rel="stylesheet" href="{% static 'polls/style.css' %}">

{% if latest_suggestion_list %}
    <ul>
    {% for suggestion in latest_suggestion_list %}
        <li><a href="{% url 'polls:detail' suggestion.id %}">{{ suggestion.suggestion_box }}</a></li>

    {% endfor %}
    </ul>
{% else %}
    <p>No polls are available.</p>
{% endif %}
