<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    {% load static %}
    <link rel="stylesheet" href="{% static 'polls/style.css' %}">
</head>
<body>


    <h1>{{ suggestion.suggestion_box }}</h1>

    <ul>
    {% for choice in suggestion.choice_set.all %}
        <li>{{ choice.choice_text }} -- {{ choice.votes }} vote{{ choice.votes|pluralize }}</li>
    {% endfor %}
    </ul>

    <a href="{% url 'feedback:detail' suggestion.id %}">Would you like to vote again?</a>
    <br>
    <a href="{% url 'feedback:index'%}">Back to Feedback Questions </a>
    <br>
    <a href="{% url 'carpool:index'%}">Back to Homepage</a>




</body>
</html>
