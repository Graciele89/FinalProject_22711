{% extends "base.html" %}

{% block title %}New Request {% endblock %}


{% block content %}
    <form method="POST" action="{% url 'carpool:post' user.id %}" enctype="multipart/form-data"> {# allows to send the files to the server#}

    {% csrf_token %}
    {{ form.as_p }}
    <div>
        <button type="submit"> Submit my Request </button>
    </div>
    </form>

{% endblock %}
