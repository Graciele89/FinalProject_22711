
{% extends "base.html" %}

{% block title %} Homepage {% endblock %}

{% block content %}
{% if user.is_authenticated %}
  Hi {{ user.username }}!
     <p><a href="{% url 'logout' %}">Log Out</a></p>
{% else %}
  <p>You are not logged in</p>
  <a href="{% url 'login' %}">Log In</a>
{% endif %}


   <h1>{{ my_object_whatsoever }}</h1>

{% endblock %}
